{% extends "base.html" %}

{% block title %}Party Planning - PocketSmart AI{% endblock %}

{% block content %}

<div class="hero">

    <h1>🎉 Party Planning</h1>

    <p>
        Plan your perfect party within your budget.
    </p>

    <div class="category-container">

        <div class="category-card">

            <h2>Plan Your Party</h2>

            <p>
                Enter your budget and preferences to get smart party recommendations.
            </p>

            <form>

                <label for="budget">Budget (₹)</label>
                <br><br>

                <input
                    type="number"
                    id="budget"
                    name="budget"
                    placeholder="Enter your budget"
                    required
                >

                <br><br>

                <label for="preferences">Preferences</label>
                <br><br>

                <textarea
                    id="preferences"
                    name="preferences"
                    placeholder="Example: Birthday party for 20 people"
                    rows="4"
                    required
                ></textarea>

                <br><br>

                <button type="submit">
                    Get Recommendations
                </button>

            </form>

            <div id="recommendation-result"></div>

        </div>

    </div>

</div>

{% endblock %}
